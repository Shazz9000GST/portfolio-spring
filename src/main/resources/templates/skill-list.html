<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>学習項目一覧</title>
    
    <link rel="stylesheet" th:href="@{/css/skill-list.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-title">
            My Portfolio
        </div>

        <a th:href="@{/logout}" class="logout-button">
            ログアウト
        </a>
    </header>

    <div class="modal-overlay" th:if="${studyTimeSuccess}">
        <div class="success-modal">
            <p class="success-message">
                <span th:text="${registeredSkillName}"></span>の学習時間を保存しました!
            </p>

            <a class="modal-back-button" th:href="@{/skill-list(month=${selectedMonth})}">
                編集ページに戻る
            </a>
        </div>
    </div>

    <main>
        <div class="wrapper">
            <!-- 月選択プルダウン -->
            <div class="month-dropdown">

                <!-- 選択中の月 -->
                <button type="button" class="month-button" id="month-button" aria-expanded="false"
                    aria-controls="month-menu">

                    <span th:text="${T(java.time.YearMonth).parse(selectedMonth).monthValue} + '月'"></span>
                    <svg class="month-arrow" width="20" height="12" viewBox="0 0 20 12" aria-hidden="true">
                        <path d="M0 0 H20 L10 12 Z" fill="currentColor" />
                    </svg>
                </button>

                <!-- 月選択メニュー -->
                <div class="month-menu" id="month-menu" hidden>
                    <a th:each="option : ${monthOptions}" th:href="@{/skill-list(month=${option.value})}"
                        th:text="${option.label}" th:classappend="${option.value == selectedMonth} ? 'selected' : ''">
                    </a>
                </div>
            </div>

            <!-- カテゴリー別一覧 -->
            <section class="skill-category" th:each="category : ${categories}">
                <div class="category-header">
                    <h2 th:text="${category.name}"></h2>
                    <a th:href="@{/skill-add(category=${category.name}, month=${selectedMonth})}" class="add-button">
                        項目を追加する
                    </a>
                </div>

                <table class="skill-table">
                    <thead>
                        <tr>
                            <th>項目名</th>
                            <th>学習時間</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="item : ${category.items}">
                            <td th:text="${item.name}"></td>

                            <td>
                                <form th:id="${'study-form-' + item.id}" th:action="@{/skill-list/study-time}" method="post" novalidate>
                                    <input type="hidden" name="skillId" th:value="${item.id}">
                                    <input type="hidden" name="month" th:value="${selectedMonth}">
                                    <input type="hidden" name="skillName" th:value="${item.name}">
                                    <input type="number" class="study-hours" name="studyHours" th:value="${studyTimeErrorId == item.id ? inputStudyHours : item.studyHours}" min="0" step="1">
                                    <p class="validation-error" th:if="${studyTimeErrorId == item.id and studyTimeError != null}" th:text="${studyTimeError}"></p>
                                </form>
                            </td>

                            <td>
                                <button type="submit" class="save-button" th:attr="form=${'study-form-' + item.id}">
                                    学習時間を保存する
                                </button>
                            </td>

                            <td>
                                <button type="button" class="delete-button" disabled>
                                    削除する
                                </button>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(category.items)}">
                            <td colspan="4">
                                登録された項目はありません
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>portfolio site</p>
    </footer>

    <script>
        const monthButton = document.getElementById("month-button");
        const monthMenu = document.getElementById("month-menu");

        // ドロップダウン開閉
        monthButton.addEventListener("click", () => {
            const isOpen = !monthMenu.hidden;

            monthMenu.hidden = isOpen;
            monthButton.setAttribute("aria-expanded", String(!isOpen));
        });

        // ドロップダウン外側クリックで閉じる
        document.addEventListener("click", (event) => {
            if (!event.target.closest(".month-dropdown")) {
                monthMenu.hidden = true;
                monthButton.setAttribute("aria-expanded", "false");
            }
        });

        // Escapeキーでドロップダウン閉じる
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                monthMenu.hidden = true;
                monthButton.setAttribute("aria-expanded", "false");
                monthButton.focus();
            }
        });
    </script>
</body>

</html>
