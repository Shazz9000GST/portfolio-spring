<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>新規登録</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

    <header class="header">

        <div class="header-title">
            My Portfolio
        </div>

        <a th:href="@{#}" class="login-button">
            ログイン
        </a>

    </header>


    <main class="register-main">
        <div class="register-container">
            <h1 class="register-title">
                新規登録
            </h1>

            <form
                class="register-form"
                th:action="@{/register}"
                th:object="${userRegisterForm}"
                method="post"
                novalidate
            >

                <div class="form-group">
                    <label for="userName">氏名</label>

                    <input
                        type="text"
                        th:field="*{userName}"
                        placeholder="アカデミー花子"
                    >

                    <p
                        class="field-error"
                        th:if="${#fields.hasErrors('userName')}"
                        th:errors="*{userName}"
                    ></p>
                </div>


                <div class="form-group">
                    <label for="email">メールアドレス</label>

                    <input
                        type="email"
                        th:field="*{email}"
                        placeholder="example@example.com"
                    >

                    <p
                        class="field-error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}"
                    ></p>
                </div>


                <div class="form-group">
                    <label for="password">パスワード</label>

                    <input
                        type="password"
                        th:field="*{password}"
                        placeholder="パスワードを入力"
                    >

                    <p
                        class="field-error"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}"
                    ></p>
                </div>


                <div class="register-button-area">
                    <button
                        type="submit"
                        class="register-button"
                    >
                        登録する
                    </button>
                </div>
            </form>
        </div>
    </main>


    <footer class="footer">
        <p>portfolio site</p>
    </footer>
</body>

</html>
