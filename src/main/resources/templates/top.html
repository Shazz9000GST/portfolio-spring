<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>トップページ</title>

    <link rel="stylesheet" th:href="@{/css/top.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto" rel="stylesheet">
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        const chartData = /*[[${chartData}]]*/[];
        const labels = chartData.map(data => data.month);
        const ctx = document.getElementById("studyChart");

        console.log("ctx:", ctx);
        console.log("canvas:", document.getElementById("studyChart"));
        console.log("読み込み状態:", document.readyState);

        new Chart(ctx, {
            type: "bar",
            data: {
                labels: labels,
                datasets: [
                    {
                        label: "バックエンド",
                        data: chartData.map(data => data.backend),
                        backgroundColor: "rgba(242, 182, 196, 0.65)",
                        borderColor: "#EFA1B3",
                        borderWidth: 1,
                        barPercentage: 0.75,
                        categoryPercentage: 0.8
                    },
                    {
                        label: "フロントエンド",
                        data: chartData.map(data => data.frontend),
                        backgroundColor: "rgba(247, 209, 174, 0.65)",
                        borderColor: "#F4B981",
                        borderWidth: 1,
                        barPercentage: 0.75,
                        categoryPercentage: 0.8
                    },
                    {
                        label: "インフラ",
                        data: chartData.map(data => data.infra),
                        backgroundColor: "rgba(251, 230, 180, 0.65)",
                        borderColor: "#F6D28A",
                        borderWidth: 1,
                        barPercentage: 0.75,
                        categoryPercentage: 0.8
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        position: "top"
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return context.dataset.label + ": " + context.parsed.y + "時間";
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 100,
                        ticks: {
                            precision: 0
                        }
                    }
                }
            }
        });
    });
</script>

<body>
    <header class="header">
        <div class="header-title">
            My Portfolio
        </div>

        <a th:href="@{/logout}" class="logout-button">
            ログアウト
        </a>
    </header>

    <main>
        <div class="wrapper">
            <div class="profile">
                <div class="profile-left">
                    <div class="profile-icon">
                        <img th:if="${!#strings.isEmpty(loginUser.profileImage)}" th:src="${loginUser.profileImage}"
                            alt="プロフィール画像">
                    </div>

                    <p class="profile-name" th:text="${loginUser.userName}"></p>
                </div>

                <div class="profile-right">
                    <p class="profile-title">
                        自己紹介
                    </p>

                    <p class="profile-bio" th:text="${loginUser.userBio}">
                    </p>

                    <a th:href="@{/profile-edit}" class="profile-edit-button">
                        自己紹介を編集する
                    </a>
                </div>
            </div>
            <div class="chart-container">
                <div class="title-container">
                    <p class="chart-title">
                        学習チャート
                    </p>
                    <a th:href="@{/skill-list}" class="skill-edit-button">
                        編集する
                    </a>
                </div>

                <div class="chart-wrapper">
                    <canvas id="studyChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>portfolio site</p>
    </footer>
</body>

</html>
