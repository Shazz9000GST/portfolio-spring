<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>トップページ</title>
</head>

<body>
    <h1>トップページ</h1>
    <div th:if="${loggedIn}">
        <p>ログイン中です。</p>
        <p>
            ユーザー名：
            <span th:text="${loginUserName}"></span>
        </p>
    </div>
    <div th:unless="${loggedIn}">
        <p>ログインしていません。</p>
    </div>
</body>

</html>
