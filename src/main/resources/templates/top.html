<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>トップページ</title>

    <link rel="stylesheet" th:href="@{/css/top.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-title">
            My Portfolio
        </div>

        <a th:href="@{/logout}" class="logout-button">
            ログアウト
        </a>
    </header>

    <main>
        <div class="wrapper">
            <div class="profile">
                <div class="profile-left">
                    <div class="profile-icon">
                        <img th:if="${!#strings.isEmpty(loginUser.profileImage)}" th:src="${loginUser.profileImage}"
                            alt="プロフィール画像">
                    </div>

                    <p class="profile-name" th:text="${loginUser.userName}"></p>
                </div>

                <div class="profile-right">
                    <p class="profile-title">
                        自己紹介
                    </p>

                    <p class="profile-bio" th:text="${loginUser.userBio}">
                    </p>

                    <a th:href="@{/profile-edit}" class="profile-edit-button">
                        自己紹介を編集する
                    </a>
                </div>
            </div>
            <div class="chart-container">
                <div class="title-container">
                    <p class="chart-title">
                        学習チャート
                    </p>
                    <a th:href="@{/skill-list}" class="skill-edit-button">
                        編集する
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>portfolio site</p>
    </footer>
</body>

</html>
