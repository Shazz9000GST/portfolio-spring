services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    ports:
      - 8080:8080
      - 5050:5050
    tty: true
    volumes:
      - ./:/app
    command: tail -f /dev/null
    depends_on:
      - db

  db:
    image: postgres:13.1
    container_name: portfolio-app
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "dev"
    ports:
      - "5432:5432"